    page:'<p>Execution is the gap-closer between what an organization knows and what it does. It is where the coordination engine\'s intelligence and directional capacity are translated into the actual plans, resources, and accountabilities that make things happen. Without it, the other three points of the diamond can be individually excellent while collectively producing very little.</p><p>The failure mode at the Execution intersection is one of the most common organizational pathologies: the strategy that everyone agrees with in principle but that never gets operationalized, because the Leaders who endorsed it and the Knowers who recommended it never quite agreed on what it would actually require. Execution demands specificity, and specificity often reveals disagreements that the abstraction of strategy had concealed.</p><p>In O² diagnostic work, the strength of the Execution intersection often distinguishes organizations that are strategically sophisticated from organizations that are strategically effective — a distinction that matters enormously in the field. Strategic sophistication without strong Execution produces organizations that are very good at analyzing situations and very poor at changing them.</p>'}},
  attunement:{name:'Attunement',hover:'Where authority and meaning are embodied together — ritual, tradition, and genuine alignment',lede:'Coordination Engine · Leaders ↔ Feelers',
    ex:{sentence:'Attunement is the intersection where leadership authority and priority-setting meet — the shared practices, rituals, and traditions through which the organization\'s deepest commitments are embodied rather than merely stated.',
    paragraph:'Attunement is the most cultural of the coordination engine\'s functional roles. It is the space where authority becomes legitimate through shared practice rather than just formal position — where Leaders demonstrate that they hold the values they claim to lead by, and where Feelers\' sense of what matters most is validated by the way authority is exercised. Organizations with strong Attunement have genuine shared rituals and a palpable sense that leadership and organizational values are actually aligned. Organizations with weak Attunement have nominal shared culture and real cynicism just below the surface.',
    page:'<p>Attunement is how an organization\'s values become embodied rather than merely declared. It is the intersection at which what the Leaders do — how they exercise authority, what they choose to mark and celebrate, what they treat as sacred — reveals whether the Feelers\' sense of the organization\'s true priorities is accurate. When Leaders act in ways consistent with what the Feelers say matters, Attunement exists. When they don\'t, no amount of official communication about values will close the gap.</p><p>The rituals and traditions that live at this intersection are not decorative — they are the mechanism through which the organization\'s commitments are transmitted across time and membership. New members learn what the organization actually values not primarily through its official documents but through the practices that surround them: who is celebrated, what moments are marked, how authority is performed in small daily interactions.</p><p>In O² analysis, the quality of Attunement is often the best predictor of an organization\'s capacity to sustain its culture across leadership transitions. Organizations with strong Attunement have institutionalized their values in practice, not just in principle — which means the practices survive even when the specific Leaders who created them move on.</p>'}},
  coordinator:{name:'Coordinator',hover:'The central aligner — holds the whole network in relationship',lede:'Coordination Engine · Center',
    ex:{sentence:'The Coordinator is the single role that holds all four quadrants in relationship — the nervous system of the whole framework, the center without which the engine has no integrating principle.',
    paragraph:'The Coordinator sits at the exact center of the O² framework, equidistant from all four quadrants and all eight functions. It is not aligned with any single quadrant — it serves all of them. Its function is alignment: keeping the different parts of the network in communication, preventing fragmentation, and ensuring the system\'s full capacity can be brought to bear on any given challenge. In PGC simulations, the Coordinator role is often the most strategically critical and the most difficult to play well.',
    page:'<p>The Coordinator is the most unique role in the O² framework — the only role that does not belong to any single quadrant, function, or hemisphere. It sits at the exact center of the 2×2 matrix, at the intersection of all axes, equidistant from all four spaces. Its identity is not defined by where it stands but by the relationships it holds between all of them.</p><p>The Coordinator\'s function is alignment. In a system this complex — 33 roles, 8 functions, 4 quadrants, 2 axes, 1 root binary — fragmentation is the primary risk. Each quadrant has its own logic, its own values, its own way of understanding what needs to happen. The Coordinator is the role that can hold all of those logics simultaneously, translate between them, and keep the overall system oriented toward its shared purpose.</p><p>In PGC simulations, the Coordinator role requires the ability to listen across positions that are in genuine tension, to hold contradictions without collapsing them prematurely, and to keep the simulation moving toward coherence rather than fragmentation. It is, in a word, the hardest job in the room.</p>'}}
};

const Q = {
  palace:{name:'Palace',tagline:'Power made permanent',axis:'Establishment · State',acc:'var(--pal-acc)',bg:'var(--pal-bg)',dk:'var(--pal-dk)',
    ex:{sentence:'The Palace is institutional power made permanent — the seat of sovereign will that legitimizes itself through hierarchy, architecture, and control of information.',
    paragraph:'The Palace quadrant holds the Establishment\'s secular power — the official hierarchy, the sanctioned channels, and the full weight of institutional momentum. It does not argue for its legitimacy; it enacts it. Within any organization, the Palace is where the org chart lives, where surveillance is organized, and where the rules of engagement are set for everyone else. Its two functions — Org and Intel — give it both its skeleton and its nervous system.',
    page:'<p>The Palace is the first quadrant of the O² framework, occupying the Establishment/State position. It is the canonical home of institutionalized secular power — the state at its most organized, its most self-assured, and its most architecturally dominant.</p><p>The Palace does not ask permission. It declares itself. Where the Cathedral must make an argument about meaning, the Palace makes an argument about permanence: it is here, it has always been here, and its very existence is its justification. Think of the buildings governments build — their scale, their materials, their symmetry. This is the Palace logic made stone.</p><p>The Palace\'s two functions — <strong>Org</strong> (internal structure and maintenance) and <strong>Intel</strong> (external surveillance and knowledge-gathering) — give it both its skeleton and its nervous system. Even within the Palace, the system contains its own challengers: the Dissenter role lives inside Org itself. Durable institutions need this capacity; institutions that suppress it are accumulating errors they cannot see.</p>'},
    fns:{
      org:{name:'Org',type:'Internal',desc:'How the establishment state structures and maintains itself internally.',acc:'var(--pal-acc)',lede:'Palace · Internal',roles:['operators','facilitators','dissenters'],
        ex:{sentence:'Org is the internal architecture of state power — the rules, hierarchies, and procedures that hold the official order together.',
        paragraph:'Org represents how the Palace manages its own interior: the org chart, the chain of command, the bureaucratic procedures, and the institutional culture that makes the state feel permanent. It is the function of self-maintenance — not watching the outside world, but ensuring the interior holds together. Operators run the machinery, Facilitators smooth the gears, and Dissenters question whether the machinery is actually working correctly.',
        page:'<p>The Org function is the internal architecture of establishment state power. Where Intel faces outward to watch and know the world, Org faces inward to maintain, structure, and perpetuate the institution itself.</p><p>Org encompasses everything that makes a large institutional structure cohere: the formal hierarchy, the procedural rules, and the institutional culture that makes people feel they are part of something larger. <strong>Operators</strong> run the machinery; <strong>Facilitators</strong> coordinate across silos and maintain the informal relationships that formal structure cannot; <strong>Dissenters</strong> are the built-in critics who keep the institution honest from within.</p><p>In O² diagnostic work, the Org function is often where you find the gap between the official org chart and how the organization actually works. Who are the real operators? Which facilitators are actually powerful? And which dissenters are tolerated, which are marginalized, and which have already left?</p>'}},
      intel:{name:'Intel',type:'External',desc:'How the establishment state watches, infiltrates, and knows the world outside.',acc:'var(--pal-acc)',lede:'Palace · External',roles:['surveillors','spies','informants'],
        ex:{sentence:'Intel is how the Palace sees and maps the world beyond its walls — through surveillance, infiltration, and cultivated sources.',
        paragraph:'Intel is the external-facing function of the Palace: the state\'s apparatus for knowing. Where Org faces inward, Intel faces outward — watching adversaries, monitoring alternative structures, gathering information that can be used to preempt threats or shape events. Surveillors observe from distance, Spies penetrate under cover, and Informants are already inside alternative structures and report outward. Together, they give the Palace situational awareness.',
        page:'<p>Intel is the Palace\'s sensory apparatus — its capacity to see, map, and know the world beyond its own walls. While Org maintains the interior, Intel navigates the exterior: watching adversaries, monitoring alternative structures, and gathering intelligence that gives the establishment a decisive informational advantage.</p><p><strong>Surveillors</strong> observe from a distance, gathering information through monitoring rather than infiltration. <strong>Spies</strong> penetrate adversary spaces under cover, becoming temporarily part of what they are watching. <strong>Informants</strong> are already inside — genuine members of alternative communities who report outward to the establishment. Each mode carries different risks, different ethics, and different value.</p><p>In PGC scenarios, Intel roles hold information asymmetry, which is one of the most powerful currencies in any simulation. But they also face the deepest ethical tensions: the line between legitimate intelligence and betrayal, between knowing and weaponizing that knowledge.</p>'}}
    }
  },
  cathedral:{name:'Cathedral',tagline:'Faith made monumental',axis:'Establishment · Church',acc:'var(--cat-acc)',bg:'var(--cat-bg)',dk:'var(--cat-dk)',
    ex:{sentence:'The Cathedral is the establishment\'s meaning-making arm — institutional religion, moral authority, and the architecture of sanctioned belief.',
    paragraph:'The Cathedral quadrant is where the Establishment Church lives — the official seat of spiritual authority. Like the Palace, it declares itself. The Cathedral governs its interior through the Board function (mediating internal disputes, maintaining doctrine) and engages the world through Diplomacy (negotiating with other powers, projecting moral authority). It holds the narrative — the why — while the Palace holds the force.',
    page:'<p>The Cathedral is the Establishment\'s claim on meaning. Where the Palace says "we have the force," the Cathedral says "we have the truth." Both declare themselves — but their declarations are of fundamentally different kinds.</p><p>In organizational terms, the Cathedral quadrant represents the ideological and cultural layer of institutional power: the official doctrine, the sanctioned values, the rituals and traditions that give the organization a sense of purpose and moral legitimacy. Every large institution has a Cathedral dimension — even purely secular ones. It is wherever the "why we exist" lives.</p><p>The relationship between Palace and Cathedral is one of the most productive tensions in the framework. The Palace says "because we have the power." The Cathedral says "because it is right." In any real organization, these two claims are constantly negotiating with each other — and the health of the institution depends on how well that negotiation works.</p>'},
    fns:{
      board:{name:'Board',type:'Internal',desc:'How the establishment church governs and mediates internally.',acc:'var(--cat-acc)',lede:'Cathedral · Internal',roles:['observers','mediators','supporters'],
        ex:{sentence:'The Board is how the Cathedral governs itself internally — setting doctrine, mediating disputes, and maintaining the coherence of official belief.',
        paragraph:'The Board function is the Cathedral\'s internal governance mechanism. It handles the questions the Cathedral must answer to itself: what do we officially believe, how do we resolve doctrinal disputes, who has authority over what. Observers track the temperature of internal discourse; Mediators broker compromises; Supporters maintain the commitment that holds the whole structure together. The Board is where the Cathedral\'s internal politics happen.',
        page:'<p>The Board is the Cathedral\'s interior governance — the apparatus through which the establishment church manages its own coherence, resolves its internal conflicts, and maintains the integrity of its official doctrine.</p><p><strong>Observers</strong> monitor the temperature of internal discourse, identifying emerging tensions before they surface publicly. <strong>Mediators</strong> act: they facilitate dialogue between competing factions, broker compromises, and maintain the relationships that make continued cooperation possible. <strong>Supporters</strong> sustain: they are the keepers of institutional loyalty — the people whose belief in the mission reinforces everyone else\'s commitment.</p><p>In O² diagnostic work, the Board function often reveals the unofficial power structures — the people who actually shape doctrine through informal influence rather than formal authority.</p>'}},
      diplomacy:{name:'Diplomacy',type:'External',desc:'How the establishment church negotiates and projects outward.',acc:'var(--cat-acc)',lede:'Cathedral · External',roles:['agents','diplomats','envoys'],
        ex:{sentence:'Diplomacy is how the Cathedral carries its values and authority into the world — projecting moral legitimacy, negotiating alliances, carrying its message outward.',
        paragraph:'Diplomacy is the Cathedral\'s external face: the function that carries its values and authority into the world beyond its walls. Where Intel gathers, Diplomacy speaks and negotiates. Agents facilitate things on behalf of the institution in external spaces; Diplomats engage in formal negotiation with other power centers; Envoys carry the institution\'s message to communities it cannot reach directly. Together they are the institution\'s public voice, ambassador, and emissary.',
        page:'<p>Diplomacy is how the Cathedral moves through the world — how it makes its presence felt beyond its own structures and carries its message outward.</p><p><strong>Agents</strong> operate at the edge of the institution\'s formal reach, facilitating outcomes without requiring formal institutional involvement. <strong>Diplomats</strong> engage in recognized channels, carrying recognized authority, in exchanges that both parties understand as official. <strong>Envoys</strong> bridge the distance between institutional authority and the world it seeks to influence, embodying the institution\'s presence in spaces it cannot directly occupy.</p><p>In O² diagnostic terms, the Diplomacy function reveals how an organization presents itself externally — and whether that presentation matches its internal reality. Strong Diplomacy functions have coherent messages, skilled negotiators, and trusted envoys.</p>'}}
    }
  },
  encampment:{name:'Encampment',tagline:'Power in motion',axis:'Alternative · State',acc:'var(--enc-acc)',bg:'var(--enc-bg)',dk:'var(--enc-dk)',
    ex:{sentence:'The Encampment is the alternative state — power organized for survival and action, provisional and self-contained, ready to strike or withdraw.',
    paragraph:'The Encampment is the counterpart to the Palace in the alternative hemisphere. Where the Palace is permanent, the Encampment is provisional. Where the Palace declares itself, the Encampment withholds itself — organized around survival and purpose rather than legitimacy and display. Its two functions are Disruption (building and innovating from within) and Militia (applying force and operating in the field). The Encampment cannot win by playing the Palace\'s game, so it builds a different game entirely.',
    page:'<p>The Encampment is the Alternative State — secular, organizational, force-based power that operates outside and against the official order. The contrast with the Palace is fundamental: where the Palace is permanent, the Encampment is provisional; where the Palace declares itself, the Encampment withholds itself.</p><p>The Encampment\'s logic is organized around survival and purpose. It cannot afford the Palace\'s architectural ambitions — every resource goes toward the mission. It is turned inward: self-sustaining, self-governing, not asking for external legitimation. Its structures are functional rather than symbolic, and it is always ready to either strike or withdraw, because adaptability is its primary defensive advantage.</p><p>The two Encampment functions — <strong>Disruption</strong> (internal building and innovation) and <strong>Militia</strong> (external force and field operations) — map its dual capacity. Disruption is how the Encampment grows stronger in the long term. Militia is how it engages the external world right now. When these two are in sync, the Encampment is formidable. When they\'re not, it becomes brittle.</p>'},
    fns:{
      disruption:{name:'Disruption',type:'Internal',desc:'How the alternative state innovates and builds from within.',acc:'var(--enc-acc)',lede:'Encampment · Internal',roles:['innovators','builders','overseers'],
        ex:{sentence:'Disruption is how the Encampment builds its own internal strength — generating new approaches, constructing alternative structures, and overseeing their integrity.',
        paragraph:'Disruption is the Encampment\'s internal development function: the people and processes dedicated to building something new rather than just opposing something old. Innovators generate new ideas and approaches; Builders actually construct the new structures and systems; Overseers maintain accountability for the building process, ensuring what\'s being built actually serves the mission. This is how the Encampment grows its own capacity over time.',
        page:'<p>Disruption is the Encampment\'s most important long-term function — it is how the alternative state builds rather than merely opposes. The word is deliberate: it is not just about breaking the old order, but about building something genuinely different in its place.</p><p><strong>Innovators</strong> are the creative capacity: they identify new approaches, challenge received wisdom, and generate the ideas that might eventually become the new standard. <strong>Builders</strong> are the constructive capacity: they take innovations and actually build them — new structures, new systems, new communities of practice. <strong>Overseers</strong> are the accountability function: they ensure that what is being built actually serves the Encampment\'s mission and hasn\'t drifted.</p><p>In O² diagnostic work, the Innovator-to-Builder ratio is one of the most revealing metrics for an alternative organization: too many Innovators and no Builders means intellectually productive but institutionally fragile.</p>'}},
      militia:{name:'Militia',type:'External',desc:'How the alternative state applies force and operates in the field.',acc:'var(--enc-acc)',lede:'Encampment · External',roles:['insurgents','militants','operatives'],
        ex:{sentence:'Militia is the Encampment\'s operational arm — the people who carry the alternative\'s force, presence, and action into the field.',
        paragraph:'Militia is the Encampment\'s external face: the function through which it engages the world beyond its own structures. Where Disruption builds inside, Militia operates outside. Insurgents challenge the established order directly; Militants are the committed action-takers who sustain the campaign over time; Operatives execute specific tasks requiring particular capabilities. The Militia is the Encampment\'s visible edge.',
        page:'<p>Militia is the Encampment\'s external operational arm — the people and structures through which the alternative state engages, challenges, and contests the world beyond its own borders.</p><p><strong>Insurgents</strong> are the most visible: they challenge the established order directly, disrupting its normal functioning and keeping the alternative cause in the public frame. <strong>Militants</strong> are the committed core: they sustain the effort over the long term, through failure and success alike. <strong>Operatives</strong> are the specialists: they execute specific tasks requiring particular skills or access, often working in ways that are less visible but highly consequential.</p><p>In O² analysis, the Militia function reveals how an organization\'s external activities relate to its internal capacity. Strong Militia functions are supplied and resupplied by strong Disruption functions — the building feeds the operating. When the connection breaks, Militia roles burn out.</p>'}}
    }
  },
  monastery:{name:'Monastery',tagline:'Faith withdrawn',axis:'Alternative · Church',acc:'var(--mon-acc)',bg:'var(--mon-bg)',dk:'var(--mon-dk)',
    ex:{sentence:'The Monastery is the alternative church — a community that has withdrawn from the official order to preserve something the Cathedral has corrupted or abandoned.',
    paragraph:'The Monastery is the counterpart to the Cathedral in the alternative hemisphere. Where the Cathedral declares itself, the Monastery withholds itself. It is faith that has turned inward — not because it has given up, but because it has decided the official church cannot be reformed from within. Its two functions are Opposition (judging and challenging from within the alternative community) and Resistance (enduring, subverting, and counter-narrativizing outward).',
    page:'<p>The Monastery is the Alternative Church — the community of meaning that has withdrawn from the official order, not in defeat, but in principled refusal. Where the Cathedral declares and displays its faith, the Monastery withholds and protects its own. It is turned inward, self-sustaining, operating outside the Cathedral\'s shadow.</p><p>The Monastery\'s logic is fundamentally about preservation and counter-narrative. It believes the official church has become corrupt, co-opted, or simply wrong — and that the true tradition must be maintained elsewhere, against pressure, through time. The Monastery builds its own liturgy, its own memory, its own community — in conscious opposition to what the Cathedral has become.</p><p>Like the Palace, the Monastery contains its own built-in critics: <strong>Doubters</strong> exist inside the Opposition function itself. The system has self-challenge at every level. The health of the Monastery can be measured in how it treats its Doubters: suppression means it is drifting toward the rigidity it was founded to resist.</p>'},
    fns:{
      opposition:{name:'Opposition',type:'Internal',desc:'How the alternative church judges, challenges, and doubts from within.',acc:'var(--mon-acc)',lede:'Monastery · Internal',roles:['judges','ringmasters','doubters'],
        ex:{sentence:'Opposition is the Monastery\'s internal critical capacity — the function of judging, questioning, and maintaining principled dissent within the alternative community itself.',
        paragraph:'Opposition is the Monastery\'s internal conscience — through which the alternative church holds itself accountable. It is not enough to oppose the Cathedral; the Monastery must also resist its own tendency toward orthodoxy. Judges render verdicts on the community\'s fidelity to its values; Ringmasters hold the space for honest internal debate; Doubters voice the questions no one else will ask. Without Opposition, the Monastery eventually becomes a mirror image of the Cathedral it opposes.',
        page:'<p>Opposition is the Monastery\'s internal critical function — the mechanism through which the alternative community holds itself accountable and resists the slide toward the very orthodoxies it opposes in the Cathedral.</p><p>This is one of the most important and underappreciated functions in the framework. Any community that defines itself by what it opposes faces a constant risk: it can become exactly what it opposes, just with different content. The Opposition function exists to prevent this.</p><p><strong>Judges</strong> render explicit verdicts about whether the community is living up to its own standards. <strong>Ringmasters</strong> orchestrate the space of internal debate: they create and maintain the conditions in which honest debate can happen. <strong>Doubters</strong> are the questioners: they voice the hesitations and the "but what if we\'re wrong" that keeps the community intellectually alive.</p>'}},
      resistance:{name:'Resistance',type:'External',desc:'How the alternative church endures, subverts, and counter-narrativizes outward.',acc:'var(--mon-acc)',lede:'Monastery · External',roles:['radicals','dissidents','exiles'],
        ex:{sentence:'Resistance is how the Monastery engages the world — through endurance under pressure, subversion of official narratives, and the patient construction of counter-stories.',
        paragraph:'Resistance is the Monastery\'s external engagement function: how it carries its alternative vision into the world beyond its own community. Unlike Militia (which operates through force), Resistance operates through narrative, endurance, and presence. Radicals push the edge of what can be said publicly; Dissidents maintain visible opposition within partially hostile contexts; Exiles carry the tradition across time and distance.',
        page:'<p>Resistance is the Monastery\'s external function — how the alternative church engages, endures, and contests within the wider world. Where Opposition faces inward, Resistance faces outward. Where Militia operates through force, Resistance operates through narrative: the patient, persistent work of telling a different story about what is true, what is right, and what is possible.</p><p><strong>Radicals</strong> push the edge of public discourse: they expand the space of what can be publicly argued or imagined. <strong>Dissidents</strong> maintain visible opposition within partially hostile environments: inside enough to be heard, outside enough to challenge. <strong>Exiles</strong> carry the tradition at the furthest remove — often the most isolated position, but sometimes the most historically important, preserving what the current order cannot accommodate.</p><p>Strong Resistance functions have Radicals making new ground, Dissidents translating that ground for broader audiences, and Exiles preserving the tradition against the day it is needed again.</p>'}}
    }
  }
};

const ENGINE = {
  points:[
    {key:'followers',pos:'Top'},
    {key:'leaders',pos:'Bottom'},
    {key:'knowers',pos:'Left'},
    {key:'feelers',pos:'Right'}
  ],
  intersections:[
    {key:'convergence',between:'Followers ↔ Knowers'},
    {key:'harmony',between:'Followers ↔ Feelers'},
    {key:'execution',between:'Leaders ↔ Knowers'},
    {key:'attunement',between:'Leaders ↔ Feelers'}
  ]
};

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let S = {curQ:null, curF:null, curView:'map', ctxTarget:null, depth:'sentence'};
const views = {map:document.getElementById('v-map'), quad:document.getElementById('v-quad'), fn:document.getElementById('v-fn'), coord:document.getElementById('v-coord')};

// ═══════════════════════════════════════════════════════
// TRANSITIONS
// ═══════════════════════════════════════════════════════
function showView(id){
  Object.entries(views).forEach(([k,el])=>{
    if(k===id){el.classList.remove('hidden');el.scrollTop=0;}
    else el.classList.add('hidden');
  });
  S.curView=id;
}

// ═══════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════
function toMap(){
  S.curQ=null;S.curF=null;
  setBc([{label:'Framework Map',active:true}]);
  showView('map');
}

function toQ(qid){
  S.curQ=qid;S.curF=null;S.ctxTarget=qid;
  const qd=Q[qid];
  setBc([{label:'Framework Map',fn:'toMap()'},{label:qd.name,active:true}]);
  renderQuad(qid);
  showView('quad');
}

function toF(e,qid,fid){
  if(e)e.stopPropagation();
  S.curQ=qid;S.curF=fid;S.ctxTarget=qid+'_'+fid;
  const qd=Q[qid],fd=qd.fns[fid];
  setBc([{label:'Framework Map',fn:'toMap()'},{label:qd.name,fn:`toQ('${qid}')`},{label:fd.name,active:true}]);
  renderFn(qid,fid);
  showView('fn');
}

function toCoord(){
  S.curQ='coordinator';S.curF=null;S.ctxTarget='coordinator';
  setBc([{label:'Framework Map',fn:'toMap()'},{label:'Coordinator',active:true}]);
  renderCoord();
  showView('coord');
}

function setBc(items){
  document.getElementById('bc').innerHTML=items.map((it,i)=>{
    const sep=i>0?'<span class="bcs">›</span>':'';
    if(it.active)return `${sep}<span class="bci on">${it.label}</span>`;
    return `${sep}<span class="bci" onclick="${it.fn}">${it.label}</span>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
// RENDERING
// ═══════════════════════════════════════════════════════
const QK = Object.keys(Q);
function qChips(curQid,curFid){
  return QK.map(k=>{
    const qd=Q[k];
    const isCur=k===curQid&&!curFid;
    return `<span class="vchip${isCur?' cur':''}" style="background:${qd.bg};color:${qd.acc};${isCur?'':'opacity:.5'}" onclick="toQ('${k}')" data-tt="${qd.tagline}" onmouseenter="tt(event,this)" onmouseleave="ht()">${qd.name}</span>`;
  }).join('')+`<span class="vsep">|</span><span class="vchip" style="background:var(--eng);color:var(--gold);opacity:.6;border-color:var(--gold-dim)" onclick="toCoord()" data-tt="Coordination Engine" onmouseenter="tt(event,this)" onmouseleave="ht()">◈ Coord</span>`;
}

function renderQuad(qid){
  const qd=Q[qid];
  const fnHtml=Object.entries(qd.fns).map(([fid,fd])=>`
    <div class="fntile" onclick="toF(null,'${qid}','${fid}')" oncontextmenu="showCtx(event,'${qid}_${fid}')" data-tt="${fd.ex.sentence}" onmouseenter="tt(event,this)" onmouseleave="ht()">
      <div class="fntile-badge">${fd.type}</div>
      <div class="fntile-name" style="color:${fd.acc}">${fd.name}</div>
      <div class="fntile-desc">${fd.desc}</div>
      <div class="fntile-roles">${fd.roles.map(rk=>`<span class="fntile-role">${R[rk].name}</span>`).join('')}</div>
    </div>`).join('');
  views.quad.innerHTML=`<div class="vinner" style="background:${qd.bg}00">
    <div class="vnav">
      <span class="vbk" onclick="toMap()">← Map</span>
      ${qChips(qid,null)}
    </div>
    <div class="qhd" oncontextmenu="showCtx(event,'${qid}')">
      <div class="qmeta">${qd.axis}</div>
      <div class="qname-big" style="color:${qd.acc}">${qd.name}</div>
      <div class="qtag">${qd.tagline}</div>
    </div>
    <div class="fn-grid">${fnHtml}</div>
  </div>`;
  views.quad.style.background=qd.bg;
}

function renderFn(qid,fid){
  const qd=Q[qid],fd=qd.fns[fid];
  const roleHtml=fd.roles.map(rk=>{
    const rd=R[rk];
    return `<div class="rc" oncontextmenu="showCtx(event,'${rk}')" data-tt="${rd.hover}" onmouseenter="tt(event,this)" onmouseleave="ht()">
      <div class="rc-name" style="color:${fd.acc}">${rd.name}</div>
      <div class="rc-phrase">${rd.hover}</div>
      <div class="rc-hint">Right-click to explore</div>
    </div>`;
  }).join('');
  views.fn.innerHTML=`<div class="vinner">
    <div class="vnav">
      <span class="vbk" onclick="toQ('${qid}')">← ${qd.name}</span>
      ${qChips(qid,fid)}
    </div>
    <div class="fhd" oncontextmenu="showCtx(event,'${qid}_${fid}')">
      <div class="fmeta">${qd.axis} · ${fd.type}</div>
      <div class="fname-big" style="color:${fd.acc}">${fd.name}</div>
      <div class="fdesc">${fd.desc}</div>
    </div>
    <div class="sec-title">Roles</div>
    <div class="rcards">${roleHtml}</div>
    <div class="sec-title">About this function</div>
    <div style="font-size:13px;line-height:1.85;color:rgba(255,255,255,.45);margin-bottom:32px">${fd.ex.paragraph}</div>
  </div>`;
  views.fn.style.background=qd.dk;
}

function renderCoord(){
  const cd=R.coordinator;
  const ptHtml=ENGINE.points.map(p=>{
    const rd=R[p.key];
    return `<div class="engcard" oncontextmenu="showCtx(event,'${p.key}')" data-tt="${rd.hover}" onmouseenter="tt(event,this)" onmouseleave="ht()">
      <div class="engcard-name">${rd.name}</div>
      <div class="engcard-sub">Point · ${p.pos}</div>
      <div class="engcard-desc">${rd.hover}</div>
    </div>`;
  }).join('');
  const itsHtml=ENGINE.intersections.map(it=>{
    const rd=R[it.key];
    return `<div class="engcard" oncontextmenu="showCtx(event,'${it.key}')" data-tt="${rd.hover}" onmouseenter="tt(event,this)" onmouseleave="ht()">
      <div class="engcard-name">${rd.name}</div>
      <div class="engcard-sub">${it.between}</div>
      <div class="engcard-desc">${rd.hover}</div>
    </div>`;
  }).join('');
  views.coord.innerHTML=`<div class="vinner">
    <div class="vnav">
      <span class="vbk" onclick="toMap()">← Map</span>
      ${qChips(null,null)}
    </div>
    <div class="qhd" oncontextmenu="showCtx(event,'coordinator')">
      <div class="qmeta">${cd.lede}</div>
      <div class="qname-big" style="color:var(--gold)">${cd.name}</div>
      <div class="qtag">The central aligner — holds the whole network in relationship</div>
    </div>
    <div class="cov-intro">${cd.ex.paragraph}</div>
    <div class="sec-title">Diamond Points — People &amp; Resources</div>
    <div class="eng-grid" style="margin-bottom:24px">${ptHtml}</div>
    <div class="sec-title">Intersections — Functional Roles</div>
    <div class="eng-grid">${itsHtml}</div>
    <div style="font-size:11px;color:rgba(255,255,255,.22);margin-top:20px;letter-spacing:.07em">33 total roles across the framework · Right-click any card for deeper explanations</div>
  </div>`;
  views.coord.style.background='var(--bg)';
}

// ═══════════════════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════════════════
const tipEl=document.getElementById('tt');
function tt(e,el){const t=el.getAttribute('data-tt');if(!t)return;tipEl.textContent=t;tipEl.style.display='block';moveTip(e);}
function ht(){tipEl.style.display='none';}
document.addEventListener('mousemove',e=>{if(tipEl.style.display==='block')moveTip(e);});
function moveTip(e){
  const x=e.clientX+14,y=e.clientY-8;
  const w=tipEl.offsetWidth,h=tipEl.offsetHeight;
  tipEl.style.left=Math.min(x,window.innerWidth-w-10)+'px';
  tipEl.style.top=Math.min(y,window.innerHeight-h-10)+'px';
}

// ═══════════════════════════════════════════════════════
// CONTEXT MENU
// ═══════════════════════════════════════════════════════
const ctxEl=document.getElementById('ctx');
function showCtx(e,id){
  e.preventDefault();e.stopPropagation();
  S.ctxTarget=id;
  const d=getD(id);
  document.getElementById('ctxname').textContent=d?d.name:id;
  ctxEl.style.display='block';
  ctxEl.style.left=Math.min(e.clientX,window.innerWidth-200)+'px';
  ctxEl.style.top=Math.min(e.clientY,window.innerHeight-145)+'px';
}
document.addEventListener('click',()=>ctxEl.style.display='none');
document.addEventListener('contextmenu',e=>{if(!e.target.closest('[oncontextmenu]')){e.preventDefault();ctxEl.style.display='none';}});

// ═══════════════════════════════════════════════════════
// DATA LOOKUP
// ═══════════════════════════════════════════════════════
function getD(id){
  if(!id)return null;
  if(R[id])return R[id];
  if(Q[id])return Q[id];
  const[q,f]=id.split('_');
  return Q[q]?.fns?.[f]||null;
}

// ═══════════════════════════════════════════════════════
// MODAL
// ═══════════════════════════════════════════════════════
function openMo(depth){
  ctxEl.style.display='none';
  if(!S.ctxTarget)return;
  const d=getD(S.ctxTarget);
  if(!d)return;
  S.depth=depth;
  document.getElementById('molede').textContent=d.lede||d.axis||'';
  document.getElementById('motitle').textContent=d.name;
  renderMo(d,depth);
  document.querySelectorAll('.motab').forEach(t=>t.classList.toggle('on',t.dataset.d===depth));
  document.getElementById('mov').classList.add('open');
}
function renderMo(d,depth){
  const txt=d.ex?.[depth]||'';
  const el=document.getElementById('mobody');
  el.innerHTML=txt.includes('<p>')?txt:`<p>${txt}</p>`;
}
function swD(depth){
  S.depth=depth;
  const d=getD(S.ctxTarget);
  if(d)renderMo(d,depth);
  document.querySelectorAll('.motab').forEach(t=>t.classList.toggle('on',t.dataset.d===depth));
}
function closeMo(){document.getElementById('mov').classList.remove('open');}
document.getElementById('mov').addEventListener('click',e=>{if(e.target===document.getElementById('mov'))closeMo();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMo();});
</script>
</body>
</html>
